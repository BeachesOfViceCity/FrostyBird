; The shipping title's verified downtown graphics settings. Presentation and
; scheduling are independent of these Nanite / hardware Lumen selections.
[SystemSettings]
r.Nanite=1
r.Nanite.MeshShaderRasterization=0
r.Nanite.PrimShaderRasterization=0
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.Reflections.Allow=1
r.RayTracing=1
r.Lumen.HardwareRayTracing=1
r.Lumen.HardwareRayTracing.Inline=1
r.Raytracing.DebugForceRuntimeBLAS=1
r.ScreenPercentage=60
r.LumenScene.Radiosity.HardwareRayTracing=0
r.Lumen.TranslucencyVolume.TraceFromVolume=0
r.RayTracing.NonBlockingPipelineCreation=0
r.RayTracing.Shadows=0
r.RayTracing.Translucency=0
r.RayTracing.AmbientOcclusion=0
r.Lumen.TranslucencyVolume.HardwareRayTracing=0
r.Lumen.Reflections.HardwareRayTracing.Retrace.HitLighting=0
r.Lumen.Reflections.HardwareRayTracing.LightingMode=0
r.Lumen.ScreenProbeGather.HardwareRayTracing.LightingMode=0
r.Lumen.RadianceCache.HardwareRayTracing.LightingMode=0

; Queue normal RHI commands and allow the game's worker paths.
r.RHICmdBypass=0
r.RHICmdUseParallelAlgorithms=1
r.RHICmdUseDeferredContexts=1
r.RDG.ParallelExecute=1
r.AsyncPipelineCompile=1
; Move compute-list eligible RDG work onto the actual compute queue.
r.RDG.AsyncCompute=2
r.Bloom.AsyncCompute=1
r.EnableAsyncComputeTranslucencyLightingVolumeClear=1
; Batch repeated material uniform updates. Free GC'd objects on the game
; thread while virtual-texture producer callbacks are draining.
r.DeferUniformExpressionCaching=1

[/Script/Engine.GarbageCollectionSettings]
gc.MultithreadedDestructionEnabled=0
