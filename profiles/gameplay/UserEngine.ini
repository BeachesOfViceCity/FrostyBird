; Shipping XSX gameplay. Keep Nanite and both Lumen render paths selected
; during the logo, Startflow, and the FMV-to-world transition.
[SystemSettings]
r.Nanite=1
; Use the cooked vertex/compute cluster rasterizers with the XS command-list
; ABI implemented here. Mesh-shader PSO streams are a separate ABI.
r.Nanite.MeshShaderRasterization=0
r.Nanite.PrimShaderRasterization=0
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.Reflections.Allow=1
; Use the retail inline HWRT permutations. The console's serialized BLAS
; belongs to its driver: use the game's own rebuild path from cooked geometry.
r.RayTracing=1
r.Lumen.HardwareRayTracing=1
r.Lumen.HardwareRayTracing.Inline=1
r.Raytracing.DebugForceRuntimeBLAS=1
; Avoid the render-thread sublist wait while the loading Slate thread shuts down.
r.RHICmdUseParallelAlgorithms=0
r.RHICmdUseDeferredContexts=0
r.RDG.ParallelExecute=0
r.AsyncPipelineCompile=0
